services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: racional
      POSTGRES_PASSWORD: racional
      POSTGRES_DB: racional
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U racional -d racional']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
